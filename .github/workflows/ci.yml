# Quality gates for every push and pull request to dev and main (audit F-19, F-66 e), plus a daily build so scheduled
# Insights articles (src/lib/publish.ts) go live on their date once deployment is automated.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Daily at 01:30 UTC. GitHub runs scheduled workflows on the default branch only.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, build, CSP
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:content
      - run: npm run build
      - run: npm run check:csp

  e2e:
    name: Playwright (desktop + mobile)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The config builds the site and serves the preview itself (playwright.config.ts).
      - run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # CI-only tool, not a devDependency (audit F-16): uses the runner's Chrome and lighthouserc.json.
      - run: npm run lhci
      # Failed assertions as annotations, readable on the run page without downloading logs.
      - name: Report failed assertions
        if: failure()
        run: |
          test -f .lighthouseci/assertion-results.json || { echo "::error title=LHCI::no assertion results (collect failed)"; exit 0; }
          node -e "for (const a of require('./.lighthouseci/assertion-results.json')) if (a.level === 'error') console.log('::error title=LHCI ' + a.auditId + '::' + a.url + ' ' + a.name + ' ' + a.operator + ' ' + a.expected + ', actual ' + a.actual)"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  docker-smoke:
    name: Docker image smoke test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t zanamtech-site:ci .
      - name: Image size
        run: |
          docker image inspect zanamtech-site:ci --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1000000}'
      - name: Run the image
        run: |
          docker run -d --name site -p 8080:8080 zanamtech-site:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
      - name: nginx config test
        run: docker exec site nginx -t
      - name: Redirects, status codes and security headers
        run: bash scripts/docker-smoke.sh http://localhost:8080
      - name: nginx logs
        if: failure()
        run: docker logs site

  scheduled-build:
    name: Scheduled build (publishes dated Insights articles)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:content
      - run: npm run build
      - run: npm run check:csp
      - name: Articles in this build
        run: ls dist/insights/
      # Deployment is not automated yet. When it is, deploy dist/ (or the Docker image) here, so an article dated
      # today goes live without a manual rebuild.
