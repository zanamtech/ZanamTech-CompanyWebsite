# Security headers (Constitution V). Included in every location that sets its own add_header,
# because nginx drops inherited add_header directives in such locations.
#
# CSP notes:
# - script-src hash = the inline no-flash theme script in src/layouts/BaseLayout.astro.
#   `npm run check:csp` fails if it drifts from the built HTML.
# - Alpine uses its CSP build (no eval), so 'unsafe-eval' is not required.
# - The form endpoint origin must match PUBLIC_FORM_ENDPOINT; add the analytics origin (PUBLIC_ANALYTICS_SRC)
#   to script-src and connect-src if analytics is enabled. `npm run check:csp` verifies both.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-k9ExuiU2ioyNU4QhUTEXLAxkYfM/FFKj8kjglP+zb40='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
