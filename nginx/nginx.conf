# Static site server for the ZanamTech website. Runs as the unprivileged `nginx` user on port 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths for a non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/javascript is the .js type in recent nginx mime.types; application/javascript is kept for older ones.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml
               application/manifest+json image/svg+xml image/x-icon;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Only static GET/HEAD are served.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        error_page 404 /404.html;

        # Fingerprinted build assets: cache forever.
        location ^~ /_astro/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Brand assets and icons: cache for a day.
        location ~* \.(?:png|webp|avif|jpg|jpeg|svg|ico|woff2)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Retired service URLs: permanent redirects (specs/002-enterprise-repositioning/contracts/routes-and-redirects.md).
        location ~ ^/services/managed-infrastructure-24-7/?$ {
            include /etc/nginx/security-headers.conf;
            return 301 /services/managed-cloud-devops;
        }

        location ~ ^/services/enterprise-ai-integration/?$ {
            include /etc/nginx/security-headers.conf;
            return 301 /services/ai-assistants-company-data;
        }

        location ~ ^/services/agentic-ai-llmops/?$ {
            include /etc/nginx/security-headers.conf;
            return 301 /services#ai;
        }

        # One URL per page: the canonical form has no trailing slash (except "/"), so /about/ 301s to /about and keeps
        # the query string. The path comes from the raw $request_uri, not the decoded $uri, so an encoded CR/LF never
        # reaches the Location header. It must start with one "/" and a character other than "/" or "\" (\x5c), so
        # //evil.example/ cannot become a protocol-relative redirect; anything else goes to the home page.
        location ~ ^/.+/$ {
            include /etc/nginx/security-headers.conf;
            if ($request_uri ~ "^(/[^/\x5c?](?:[^?]*[^/?])?)/+(?:[?]|$)") {
                return 301 $1$is_args$args;
            }
            return 301 /;
        }

        # One URL per page: /about.html 301s to /about and /index.html (or /x/index.html) to / (or /x), keeping the
        # query string. Same hardening as the trailing-slash rule: the path comes from the raw $request_uri and may not
        # start with "//" or "/\" (\x5c). An encoded form such as /about%2Ehtml does not match and gets the 404 page.
        location ~ \.html$ {
            include /etc/nginx/security-headers.conf;
            if ($request_uri ~ "^/index\.html(?:[?]|$)") {
                return 301 /$is_args$args;
            }
            if ($request_uri ~ "^(/[^/\x5c?][^?]*?)(?:/index)?\.html(?:[?]|$)") {
                return 301 $1$is_args$args;
            }
            return 404;
        }

        # The 404 page requested directly answers with status 404, not 200 (error_page then serves /404.html).
        location = /404 {
            return 404;
        }

        # HTML and everything else: always revalidate. Pages are built as files (dist/about.html is /about); /services
        # is dist/services.html beside the dist/services/ folder of child pages.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html $uri/index.html =404;
        }

        location = /404.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            internal;
        }
    }
}
