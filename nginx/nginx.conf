# Static site server for the ZanamTech website. Runs as the unprivileged `nginx` user on port 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths for a non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Only static GET/HEAD are served.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        error_page 404 /404.html;

        # Fingerprinted build assets: cache forever.
        location ^~ /_astro/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Brand assets and icons: cache for a day.
        location ~* \.(?:png|webp|avif|jpg|jpeg|svg|ico|woff2)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # HTML and everything else: always revalidate.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/index.html $uri.html =404;
        }

        location = /404.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            internal;
        }
    }
}
